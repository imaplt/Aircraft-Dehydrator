# Updated version 7
# File sizes for log and log archiving.
# 1 MB = 1048576, 5 MB = 5242880, 10 MB = 10485760 100MB = 104857600
[DEFAULT]
initial_startup = True
min_humidity = 55
max_humidity = 65
hysteresis = 10

## FAN
# Fan cycle every X minutes
TASK_FAN = 10
# How long fan should run for
fan_duration = 10
# Fan running limit in seconds
FAN_LIMIT = 120
# Fan limit timeout
FAN_LIMIT_TIMEOUT = 60

## SENSORS
# Internal check every X seconds
TASK_INTERNAL = 1
# External check every X minutes
TASK_EXTERNAL = 1
sensor_interval = 10
logfile = log.csv
max_log_size = 5242880
max_archive_size = 5242880000
# font = Quicksand-Regular.ttf
font = /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
fontsize = 24
border = 5
sensor_heat_startup_time = 10
sensor_heat_running_time = 2
installed_devices = BONNET, MUX, SHT4X_Internal, SHT4X_External, SHT4X_Ambient, EMC2101, FAN
UOM = F

# May want to set these differently
LCD_ROTATION = 2
OLED_ROTATION = 2

# TFT Input Pins
BTN_A_PIN = 5
BTN_B_PIN = 6
BTN_L_PIN = 27
BTN_R_PIN = 23
BTN_U_PIN = 17
BTN_D_PIN = 22
BTN_C_PIN = 4
BACKLIGHT_PIN = 26

[CUSTOM]
min_humidity = 56
max_humidity = 65

[LOG]
# Remember to set the low's to be a couple of degrees below the current ambient
internal_high_temp = 0
internal_low_temp = 0
internal_high_humidity = 0
internal_low_humidity = 0
external_high_temp = 0
external_low_temp = 0
external_high_humidity = 0
external_low_humidity = 0
ambient_high_temp = 0
ambient_low_temp = 0
ambient_high_humidity = 0
ambient_low_humidity = 0
cycle_count = 0
FAN_TOTAL_DURATION = 0
# Longest the fan has run
FAN_MAX_RUNTIME = 0

